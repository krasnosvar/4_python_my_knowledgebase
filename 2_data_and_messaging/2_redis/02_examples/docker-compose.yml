services:
  redis:
    image: redis:7-alpine
    container_name: redis_py_kb
    restart: unless-stopped
    ports:
      - "6379:6379"
    # --appendonly yes: включаем AOF-персистентность, чтобы данные переживали
    # рестарт контейнера между запусками примеров (не критично для кеша, но
    # удобно на время учёбы, чтобы не терять руками заполненные структуры).
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis_py_kb_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  redis_py_kb_data:
